name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: autobuilder/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: autobuilder/backend
        run: npm install

      - name: Build backend
        working-directory: autobuilder/backend
        run: npm run build

      - name: Run tests
        working-directory: autobuilder/backend
        run: npm test
